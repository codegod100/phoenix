<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - SQLite WASM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      height: 100vh;
      overflow: hidden;
    }
    
    #app {
      width: 100%;
      max-width: 1200px;
      height: 100vh;
      margin: 0 auto;
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    
    @media (max-width: 768px) {
      #app {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div style="display: flex; justify-content: center; align-items: center; height: 100%; color: #666;">
      <div>Loading SQLite WASM...</div>
    </div>
  </div>
  
  <script type="module">
    import { mountApp } from './src/generated/app';
    
    mountApp('#app')
      .then(app => {
        console.log('[notes-app] App mounted successfully');
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
          app.destroy().catch(console.error);
        });
      })
      .catch(err => {
        console.error('[notes-app] Failed to mount app:', err);
        document.getElementById('app').innerHTML = `
          <div style="padding: 32px; text-align: center; color: #d93025;">
            <h2>Failed to start</h2>
            <p>${err.message}</p>
            <p style="margin-top: 16px; font-size: 14px; color: #5f6368;">
              Check the browser console for more details.
            </p>
          </div>
        `;
      });
  </script>
</body>
</html>
