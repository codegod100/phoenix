[package]
name = "phoenix-vcs"
version = "0.1.0"
edition = "2021"
authors = ["Generated from Phoenix VCS TypeScript implementation"]
description = "Regenerative version control that compiles intent to working software"
license = "MIT"
repository = "https://github.com/example/phoenix-vcs-rust"

[[bin]]
name = "phoenix-generate"
path = "src/bin/phoenix-generate.rs"

[[bin]]
name = "generate-module"
path = "src/bin/generate-module.rs"

[lib]
name = "phoenix_vcs"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
petgraph = "0.6"
regex = "1.10"

# Tree-sitter for other languages
tree-sitter = "0.25"
tree-sitter-python = "0.25"
indexmap = "2.2"

# Panproto crates - for NCL parsing and code generation
panproto-gat = { git = "https://github.com/panproto/panproto" }
panproto-schema = { git = "https://github.com/panproto/panproto" }
panproto-parse = { git = "https://github.com/panproto/panproto" }
panproto-grammars = { git = "https://github.com/panproto/panproto", features = ["lang-nickel", "lang-nix", "lang-typescript", "lang-bash", "lang-json"] }
panproto-project = { git = "https://github.com/panproto/panproto" }
panproto-theory-dsl = { git = "https://github.com/panproto/panproto" }
panproto-mig = { git = "https://github.com/panproto/panproto" }
panproto-inst = { git = "https://github.com/panproto/panproto" }
panproto-expr = { git = "https://github.com/panproto/panproto" }
panproto-lens = { git = "https://github.com/panproto/panproto" }

# Nickel language for evaluating spec files directly
nickel-lang = { version = "2.0", default-features = false }

[features]
default = []

[dev-dependencies]
tempfile = "3.10"
