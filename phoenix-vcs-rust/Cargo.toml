[package]
name = "phoenix-vcs"
version = "0.1.0"
edition = "2021"
authors = ["Generated from Phoenix VCS TypeScript implementation"]
description = "Regenerative version control that compiles intent to working software"
license = "MIT"
repository = "https://github.com/example/phoenix-vcs-rust"

[[bin]]
name = "phoenix-vcs"
path = "src/main.rs"

[lib]
name = "phoenix_vcs"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
petgraph = "0.6"
regex = "1.10"

# Nickel language parser for NCL specs - use older version compatible with panproto's tree-sitter 0.25
# Or use tree-sitter-nickel directly for simpler parsing
tree-sitter-nickel = "0.5"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
indexmap = "2.2"

# Panproto crates - enabled with tree-sitter 0.25 compatible versions
panproto-gat = { git = "https://github.com/panproto/panproto", optional = true }
panproto-schema = { git = "https://github.com/panproto/panproto", optional = true }
panproto-parse = { git = "https://github.com/panproto/panproto", optional = true }
panproto-project = { git = "https://github.com/panproto/panproto", optional = true }
panproto-theory-dsl = { git = "https://github.com/panproto/panproto", optional = true }
panproto-mig = { git = "https://github.com/panproto/panproto", optional = true }
panproto-inst = { git = "https://github.com/panproto/panproto", optional = true }
panproto-expr = { git = "https://github.com/panproto/panproto", optional = true }

# Nickel language for evaluating spec files directly (same version as panproto)
nickel-lang = { version = "2.0", default-features = false, optional = true }

[features]
default = ["panproto"]
panproto = ["dep:panproto-gat", "dep:panproto-schema", "dep:panproto-parse", "dep:panproto-project", "dep:panproto-theory-dsl", "dep:panproto-mig", "dep:panproto-inst", "dep:panproto-expr", "dep:nickel-lang"]

[dev-dependencies]
tempfile = "3.10"

[[example]]
name = "protocol_migration_demo"
path = "examples/protocol_migration_demo.rs"

[[example]]
name = "python_parser_demo"
path = "examples/python_parser_demo.rs"

[[example]]
name = "nickel_to_python_migration"
path = "examples/nickel_to_python_migration.rs"

[[example]]
name = "panproto_generation_demo"
path = "examples/panproto_generation_demo.rs"

[[example]]
name = "emit_with_protocol_demo"
path = "examples/emit_with_protocol_demo.rs"

[[example]]
name = "python_to_go_migration"
path = "examples/python_to_go_migration.rs"

[[example]]
name = "minimal_migration"
path = "examples/minimal_migration.rs"

[[example]]
name = "ncl_to_go_function"
path = "examples/ncl_to_go_function.rs"

[[example]]
name = "ncl_func_to_go_migration"
path = "examples/ncl_func_to_go_migration.rs"

[[example]]
name = "panproto_ncl_to_go_migration"
path = "examples/panproto_ncl_to_go_migration.rs"

[[example]]
name = "ncl_to_go_lift"
path = "examples/ncl_to_go_lift.rs"

[[example]]
