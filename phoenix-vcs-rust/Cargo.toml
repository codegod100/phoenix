[package]
name = "phoenix-vcs"
version = "0.1.0"
edition = "2021"
authors = ["Generated from Phoenix VCS TypeScript implementation"]
description = "Regenerative version control that compiles intent to working software"
license = "MIT"
repository = "https://github.com/example/phoenix-vcs-rust"

[[bin]]
name = "phoenix-vcs"
path = "src/main.rs"

[lib]
name = "phoenix_vcs"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
petgraph = "0.6"
regex = "1.10"

# Nickel language parser for NCL specs - use older version compatible with panproto's tree-sitter 0.25
nickel-lang-core = "0.12"
indexmap = "2.2"

# Panproto crates disabled due to tree-sitter conflict with nickel-lang-core
# panproto-gat = { git = "https://github.com/panproto/panproto", optional = true }
# panproto-schema = { git = "https://github.com/panproto/panproto", optional = true }
# panproto-parse = { git = "https://github.com/panproto/panproto", optional = true }
# panproto-project = { git = "https://github.com/panproto/panproto", optional = true }

[features]
default = []
# panproto = ["dep:panproto-gat", "dep:panproto-schema", "dep:panproto-parse", "dep:panproto-project"]

[dev-dependencies]
tempfile = "3.10"
